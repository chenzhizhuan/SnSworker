# SnSworker 本地开发基础设施（PostgreSQL + Redis）
#
# 用途：给新同学一键拉起本地数据库 + Redis，避免本机装数据库。
# 应用层（Django / Electron / Celery）仍在宿主机跑，通过 localhost 端口连接。
#
# 业务关系库只走 PostgreSQL（与 settings.py 单库架构对齐；MySQL 已于 INFRA-30 退役）。
# `up -d` 起 postgres + redis 两件套。
#
# 启动：docker compose -f docker-compose.dev.yml up -d
# 停止：docker compose -f docker-compose.dev.yml down
# 日志：docker compose -f docker-compose.dev.yml logs -f
#
# 业务库 = PostgreSQL `snsworker_single`（与根 .env 的 PG_DB_NAME 对齐），
# 凭证 user `snsworker` / 密码 `snsworker_dev_pass`。checkout 后无需改 env，bash scripts/dev/menu.sh 即连得上。
#
# 首次使用（空库建表）：
#   bash scripts/dev/menu.sh        # 菜单启动；或直接 source venv && python apps/tabtin_django/manage.py migrate
#   # 需要导入快照时见 dev-db-dumps/README.md
#
# 可选搜索引擎不属于此基础栈；需要时自行提供 SEARCH_ES_HOSTS。
#
# ⚠️ project 名必须显式，避免与同目录下的其他 Compose 项目共享默认项目名。
# 推导的默认 project 名（如 snsworker），`up -d` 会把对方的同名服务（postgres/redis）
# 误当本项目服务重建，互相摧毁容器。这里固定 name: snsworker-dev，与部署栈彻底隔离。
name: snsworker-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: snsworker-postgres-dev
    restart: unless-stopped
    environment:
      # 单库默认业务库 = snsworker_single，与根 .env 的 PG_DB_NAME 对齐，
      # 这样 checkout 后 bash scripts/dev/menu.sh / runserver 直接连得上（INFRA-9）。
      POSTGRES_DB: snsworker_single
      POSTGRES_USER: snsworker
      POSTGRES_PASSWORD: snsworker_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - snsworker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snsworker -d snsworker_single"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - snsworker-dev

  redis:
    image: redis:8-alpine
    container_name: snsworker-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - snsworker-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - snsworker-dev

networks:
  snsworker-dev:
    name: snsworker-dev
    driver: bridge

volumes:
  snsworker-postgres-data:
    name: snsworker-postgres-data
  snsworker-redis-data:
    name: snsworker-redis-data
