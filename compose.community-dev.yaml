x-community-dev-image: &community-dev-image
  image: snsworker/community-django:dev
  build:
    context: .
    dockerfile: apps/tabtin_django/Dockerfile
    args:
      BASE_IMAGE: python:3.11-slim
      INSTALL_PLAYWRIGHT: 'false'
      TABTIN_DEV_DEPENDENCY_FINGERPRINT: ${TABTIN_DEV_DEPENDENCY_FINGERPRINT:-unknown}

services:
  django:
    <<: *community-dev-image
    command: ['community-dev-web']
    volumes:
      - ./apps/tabtin_django:/app/apps/tabtin_django
      - ./packages:/app/packages:ro
      - ./community-assets:/app/community-assets:ro
      - installation-secrets:/run/snsworker-secrets
      - local-objects:/var/lib/snsworker/objects
      - playwright-data:/ms-playwright

  celery:
    <<: *community-dev-image
    volumes:
      - ./apps/tabtin_django:/app/apps/tabtin_django
      - ./packages:/app/packages:ro
      - installation-secrets:/run/snsworker-secrets:ro
      - local-objects:/var/lib/snsworker/objects
      - playwright-data:/ms-playwright

volumes:
  playwright-data:
    name: snsworker-playwright-data
