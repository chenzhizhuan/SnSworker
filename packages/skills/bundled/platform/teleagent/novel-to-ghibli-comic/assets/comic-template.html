<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉卜力四格漫画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e8;
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    color: #3a3226;
    padding: 40px 20px;
  }
  .comic-container {
    max-width: 900px;
    margin: 0 auto;
  }
  .comic-title {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 8px;
    letter-spacing: 0.15em;
  }
  .comic-subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: #8a7e6b;
    margin-bottom: 40px;
    letter-spacing: 0.3em;
  }

  /* === Four-Panel 2x2 Grid Layout === */
  .layout-four-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 16px;
    margin-bottom: 32px;
  }

  /* === Panel Styling === */
  .panel {
    background: #fff;
    border: 3px solid #3a3226;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow: 3px 3px 0 rgba(58,50,38,0.15);
  }
  .panel img {
    width: 100%;
    display: block;
    aspect-ratio: 1 / 1;
    object-fit: cover;
  }

  /* Panel number badge */
  .panel-number {
    position: absolute;
    top: 0;
    left: 0;
    background: #3a3226;
    color: #fff;
    font-size: 0.75rem;
    padding: 3px 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    z-index: 5;
  }

  .panel-caption {
    padding: 12px 16px;
    font-size: 0.92rem;
    line-height: 1.7;
    border-top: 2px solid #e0d8c8;
    background: #fdfbf7;
  }
  .panel-caption .narration {
    color: #6a5d4a;
    font-style: italic;
  }
  .panel-caption .dialogue {
    color: #3a3226;
    font-weight: 600;
  }
  .panel-caption .dialogue::before {
    content: "\201C";
  }
  .panel-caption .dialogue::after {
    content: "\201D";
  }

  .comic-footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.8rem;
    color: #b0a48f;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
<div class="comic-container">

  <!-- ============================= -->
  <!--  Title Section (edit this)     -->
  <!-- ============================= -->
  <h1 class="comic-title">{{TITLE}}</h1>
  <p class="comic-subtitle">{{SUBTITLE}}</p>

  <!-- ============================= -->
  <!--  Four-Panel 2x2 Grid            -->
  <!--  Panel 1 (Top Left)  Panel 2 (Top Right)  -->
  <!--  Panel 3 (Bottom Left)  Panel 4 (Bottom Right)  -->
  <!-- ============================= -->
  <div class="layout-four-panel">

    <!-- Panel 1 (Setup) - Top Left -->
    <div class="panel">
      <span class="panel-number">01</span>
      <img src="{{IMAGE_1}}" alt="Panel 1 - Setup">
      <div class="panel-caption">
        <span class="narration">{{NARRATION_1}}</span>
        <br>
        <span class="dialogue">{{DIALOGUE_1}}</span>
      </div>
    </div>

    <!-- Panel 2 (Development) - Top Right -->
    <div class="panel">
      <span class="panel-number">02</span>
      <img src="{{IMAGE_2}}" alt="Panel 2 - Development">
      <div class="panel-caption">
        <span class="narration">{{NARRATION_2}}</span>
        <br>
        <span class="dialogue">{{DIALOGUE_2}}</span>
      </div>
    </div>

    <!-- Panel 3 (Twist) - Bottom Left -->
    <div class="panel">
      <span class="panel-number">03</span>
      <img src="{{IMAGE_3}}" alt="Panel 3 - Twist">
      <div class="panel-caption">
        <span class="narration">{{NARRATION_3}}</span>
        <br>
        <span class="dialogue">{{DIALOGUE_3}}</span>
      </div>
    </div>

    <!-- Panel 4 (Resolution) - Bottom Right -->
    <div class="panel">
      <span class="panel-number">04</span>
      <img src="{{IMAGE_4}}" alt="Panel 4 - Resolution">
      <div class="panel-caption">
        <span class="narration">{{NARRATION_4}}</span>
        <br>
        <span class="dialogue">{{DIALOGUE_4}}</span>
      </div>
    </div>

  </div>

  <!-- ============================= -->
  <!--  Footer                        -->
  <!-- ============================= -->
  <div class="comic-footer">— Studio Ghibli Style 4-Koma Comic —</div>

</div>
</body>
</html>
