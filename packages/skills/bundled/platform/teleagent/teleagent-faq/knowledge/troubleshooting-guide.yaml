# ──────────────────────────────────────────────
# TeleAgent 用户支持 FAQ Pro — 故障自助排查指南
# 更新时间: 2026-06-24
# ──────────────────────────────────────────────

# 本文件按用户可感知的症状组织，同一症状可能对应多种原因，
# 因此将所有可尝试的自助策略平铺给出，用户按顺序尝试即可。
# 本skill不承担问题原因定位职能，如所有策略均无效，
# 统一建议加入用户群联系官方人员排查。

troubleshooting:

  # ══════════════════════════════════════════════
  # 症状: 软件打不开 / 闪退 / 启动报错
  # ══════════════════════════════════════════════
  - symptom_group: "软件打不开、闪退、启动报错"
    strategies:
      - step: 1
        action: "重启软件试试"
        detail: "关闭软件后重新打开，特别是电脑休眠恢复后建议重启。"

      - step: 2
        action: "检查安全软件是否拦截"
        detail: |
          如果安装了杀毒软件或企业安全管控软件（如火绒、联软等），可能拦截了软件启动。
          - 将TeleAgent加入安全软件白名单
          - 企业用户：联系IT部门提单加白

      - step: 3
        action: "检查安装包是否匹配"
        detail: "确认下载的安装包与电脑系统架构一致（Mac选Apple Silicon或Intel版本，Windows选对应架构）。如不确定，卸载后重新下载正确版本。"

      - step: 4
        action: "删除运行时目录重启"
        detail: "软件的核心运行文件可能被安全软件隔离。删除软件安装目录下的 runtimes/super-agent 文件夹，然后重启软件（会自动重新提取文件）。"

      - step: 5
        action: "删除自定义技能后重试"
        detail: "如果导入自定义技能后出问题，删除技能目录后重启。技能目录在 ~/.config/teleai-super-agent/skills/ 下。"

      - step: 6
        action: "全清重装"
        detail: |
          如以上均无效，建议全清重装：
          1. 卸载软件
          2. 删除残余数据目录：~/.local/share/teleai-super-agent/
          3. 删除配置目录：~/.config/teleai-super-agent/
          4. 重新下载安装最新版本

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: Mac 安装后打不开
  # ══════════════════════════════════════════════
  - symptom_group: "Mac安装后打不开"
    strategies:
      - step: 1
        action: "清除macOS安全标记"
        detail: |
          macOS可能阻止了软件运行。需要三步操作（均不可省略）：
          1. 卸载软件
          2. 打开终端执行：sudo xattr -r -d com.apple.quarantine /Applications/TeleAgent.app（如重新安装前执行则路径对应安装包）
          3. 重新安装

      - step: 2
        action: "检查macOS安全权限设置"
        detail: "在系统设置→隐私与安全性中，允许从以下位置下载的应用选择'任何来源'。"

      - step: 3
        action: "创建缺失的系统目录"
        detail: "打开终端执行：mkdir -p ~/.local/state"

      - step: 4
        action: "修复配置目录权限"
        detail: |
          如提示权限不足，在终端执行：
          - 如果 ~/.config 是文件而非目录：rm ~/.config && mkdir -p ~/.config
          - 如果 ~/.config 所有者是root：sudo chown $(whoami):staff ~/.config

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 连不上 / 网络错误
  # ══════════════════════════════════════════════
  - symptom_group: "连不上、网络错误、无法访问"
    strategies:
      - step: 1
        action: "检查网络连接"
        detail: "用浏览器访问任意网页确认网络是否正常。如网络本身不通，先解决网络问题。"

      - step: 2
        action: "检查代理设置残留（Windows常见）"
        detail: |
          如果之前使用过VPN或代理软件，可能留下残留设置：
          方法一（注册表）：打开cmd执行 reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings" /v ProxyEnable /t REG_DWORD /d 0 /f
          方法二（环境变量）：检查系统环境变量中是否有 HTTP_PROXY 或 HTTPS_PROXY 指向 127.0.0.1 的条目，如有则删除
          注意：清除后需要重启软件

      - step: 3
        action: "尝试手机热点"
        detail: "切换到手机热点测试，排除当前网络环境问题。"

      - step: 4
        action: "检查防火墙"
        detail: |
          Windows：在防火墙设置中添加入站规则，允许端口4397/TCP；或临时关闭防火墙验证
          如关闭防火墙后能连上，说明是防火墙拦截，需添加规则

      - step: 5
        action: "检查企业安全软件"
        detail: "企业内网用户：联系IT部门将TeleAgent加入安全白名单。"

      - step: 6
        action: "刷新页面或新建会话"
        detail: "如果是使用过程中突然断连，尝试刷新页面或新建会话。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 白屏 / 界面空白
  # ══════════════════════════════════════════════
  - symptom_group: "白屏、界面空白"
    strategies:
      - step: 1
        action: "刷新页面或重启软件"
        detail: "直接关闭软件重新打开，或刷新当前页面。"

      - step: 2
        action: "关闭不必要的旧会话"
        detail: "内存较小的设备（如8GB），同时打开过多会话可能导致白屏。在左侧历史任务列表中清理不用的旧会话。"

      - step: 3
        action: "定期重启软件"
        detail: "长时间不关软件可能积累内存占用，建议每天重启一次。"

      - step: 4
        action: "清理数据重开"
        detail: "如反复白屏，可尝试删除数据库文件后重启（会清除历史记录）。数据库路径：~/.local/share/teleai-super-agent/ 下相关db文件。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 微信/企微消息无回复
  # ══════════════════════════════════════════════
  - symptom_group: "微信或企业微信发消息无回复"
    strategies:
      - step: 1
        action: "重置IM连接状态"
        detail: |
          删除IM状态文件后重启软件：
          - 微信：删除 ~/.local/share/teleai-super-agent/im-service/weixin-state.json
          - 企业微信：删除 ~/.local/share/teleai-super-agent/im-service/wecom-state.json
          删除后重启软件，重新配置IM连接。

      - step: 2
        action: "检查桌面端软件是否运行"
        detail: "确保电脑端TeleAgent软件正在运行，IM功能依赖桌面端软件。"

      - step: 3
        action: "重新配置IM连接"
        detail: "在软件的IM管理页面删除当前连接，重新扫码或配置凭证。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 卡在引导/登录界面
  # ══════════════════════════════════════════════
  - symptom_group: "卡在引导界面、卡在登录界面"
    strategies:
      - step: 1
        action: "重启软件"
        detail: "关闭软件后重新打开。"

      - step: 2
        action: "清除登录状态重新登录"
        detail: "退出当前账号，重新登录。"

      - step: 3
        action: "清除插件缓存"
        detail: "删除 ~/.config/teleai-super-agent/ 下的插件缓存相关目录后重启。"

      - step: 4
        action: "全清重装"
        detail: |
          1. 卸载软件
          2. 删除 ~/.local/share/teleai-super-agent/
          3. 删除 ~/.config/teleai-super-agent/
          4. 重新下载安装最新版本

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 任务执行异常 / 中断 / 卡住
  # ══════════════════════════════════════════════
  - symptom_group: "任务执行异常、中断、卡住"
    strategies:
      - step: 1
        action: "新建会话重试"
        detail: "当前会话状态可能异常，新建一个会话重新执行任务。"

      - step: 2
        action: "简化任务指令"
        detail: "将复杂任务拆分为多个简单步骤分步执行，避免一次性生成过多内容。"

      - step: 3
        action: "检查模型选择"
        detail: "确认当前选择的模型可用。如提示模型相关错误，在设置中切换到其他模型。"

      - step: 4
        action: "重新登录"
        detail: "如提示登录相关错误，退出账号后重新登录。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 安装失败 / 升级失败
  # ══════════════════════════════════════════════
  - symptom_group: "安装失败、升级失败、旧版卸载后装不上"
    strategies:
      - step: 1
        action: "确保旧版完全退出"
        detail: "检查任务管理器中是否有TeleAgent相关进程仍在运行，如有先全部结束。"

      - step: 2
        action: "清理旧版残余"
        detail: |
          Windows：使用Geek Uninstaller等工具彻底卸载，或手动清除以下位置：
          - C:\\Users\\你的用户名\\.local\\share\\teleai-super-agent\\
          - C:\\Users\\你的用户名\\.config\\teleai-super-agent\\
          - 注册表中搜索TeleAgent相关项

      - step: 3
        action: "重启电脑后重装"
        detail: "清完残余后重启电脑，再重新安装。"

      - step: 4
        action: "检查安全软件"
        detail: "安装过程中如被安全软件拦截，暂时关闭安全软件后安装，安装完再开启。"

      - step: 5
        action: "云电脑提示'无法访问指定设备、路径或文件'——文件名关键词被安全软件拦截"
        detail: |
          云电脑环境下，安装时提示"Windows无法访问指定设备、路径或文件。你可能没有适当的权限访问该项目"，如果路径本身无问题（纯英文、无空格），可能是企业安全软件对文件名中的特定关键词做了拦截。
          已知案例：旧版安装文件名中的"Claw"被安全软件识别为风险关键词，阻止执行（v2.0.0已更名，此问题不再出现）。
          如仍遇到类似拦截，尝试将安装文件名中的可疑关键词删除后重新运行。

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 旧版本升级 / 安装冲突
  # ══════════════════════════════════════════════
  - symptom_group: "旧版本升级、安装程序冲突"
    strategies:
      - step: 1
        action: "1.0.3及以下版本需先卸载旧版再安装新版"
        detail: "1.0.3及以下版本如果直接安装新版会导致新旧版本并存。请先卸载旧版本，再安装新版本。历史任务、记忆、技能不受影响。"

      - step: 2
        action: "安装时提示'已有安装程序在运行'"
        detail: "可能是点击安装次数过多同时启动了多个安装程序，或上次的子进程未正确关闭。打开任务管理器，关闭所有TeleAgent相关进程后重试。"

      - step: 3
        action: "提示'不是有效的win32应用程序'"
        detail: "星辰超级智能体要求Windows 10及以上64位操作系统。请确认您的系统版本满足要求。"

      - step: 4
        action: "云电脑(Windows Server)安装后报Unable to connect"
        detail: "云桌面虚拟机可能无直连公网能力，需设置HTTP_PROXY/HTTPS_PROXY环境变量。步骤：1)向IT确认代理地址；2)设置系统环境变量；3)重启软件。Windows Server 2022以上镜像可用，2016不支持。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 记忆丢失
  # ══════════════════════════════════════════════
  - symptom_group: "记忆丢失、升级后记忆没了"
    strategies:
      - step: 1
        action: "检查是否切换了工作空间"
        detail: "切换工作空间文件夹后，之前的记忆不会跟随。可在软件中执行指令查找历史配置文件存储位置。"

      - step: 2
        action: "单个对话上下文过大"
        detail: "如果单个对话消耗了大量上下文（如300万token），模型可能对上下文进行压缩折叠，导致原有记忆内容丢失。建议定期新建会话。"

      - step: 3
        action: "版本升级后丢失"
        detail: "部分版本升级后可能存在兼容问题导致记忆丢失，此问题已登记处理。如频繁出现请导出日志反馈。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 技能广场加载不出来
  # ══════════════════════════════════════════════
  - symptom_group: "技能广场加载不出来、技能页面空白"
    strategies:
      - step: 1
        action: "检查网络连接"
        detail: "技能广场需要网络访问。检查右上角小圆点是否为绿色（绿色表示服务正常）。"

      - step: 2
        action: "退出重新进入"
        detail: "退出技能广场页面后重新进入试试。"

      - step: 3
        action: "重启软件"
        detail: "完全退出软件后重新打开。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 模型配置问题
  # ══════════════════════════════════════════════
  - symptom_group: "模型列表不显示、Authentication Fails、Model not found、invalid API key"
    strategies:
      - step: 1
        action: "检查防火墙和安全软件"
        detail: "模型列表不显示通常为防火墙拦截。关闭防火墙（含第三方杀软如火绒），重启程序重试。右上角小圆点变绿表示服务正常。"

      - step: 2
        action: "确认模型供应商选择正确"
        detail: "提示Authentication Fails或invalid API key时，确认选择的模型供应商正确。天翼云Token Plan和息壤是不同的供应商选项，KEY不能混用。"

      - step: 3
        action: "模型API变更后重新选择"
        detail: "如果默认模型的API有调整，会出现Model not found，手动在模型设置中重新选择一下模型即可。"

      - step: 4
        action: "使用DeepSeek建议直接购买官方API"
        detail: "如需使用DeepSeek模型，建议直接在DeepSeek官网购买API，在模型设置中配置。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: IM二维码刷不出来 / 微信第二条指令无响应
  # ══════════════════════════════════════════════
  - symptom_group: "微信或企微二维码刷不出来、IM连接转圈、微信第二条指令无响应"
    strategies:
      - step: 1
        action: "删除IM状态文件后重启"
        detail: |
          完全退出应用（托盘右键退出），删除IM状态文件后重启：
          - 微信：删除 ~/.local/share/teleai-super-agent/im-service/weixin-state.json
          - 企业微信：删除 ~/.local/share/teleai-super-agent/im-service/wecom-state.json

      - step: 2
        action: "清理BOM编码问题（Windows）"
        detail: "如删除状态文件后仍不行，可能是配置文件BOM编码问题。用PowerShell清理outbound-queue.json和route-map.json的BOM头。"

      - step: 3
        action: "微信第二条指令需等第一条完成"
        detail: "当前微信端不支持打断/插话，需要等上一条指令完成输出后再发下一条。如需重新发送文件，可以在对话中说'把上次对话生成的文件再发给我一遍'。"

    fallback: "如以上均无效，请导出日志提交给客服，或加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 文件输出异常
  # ══════════════════════════════════════════════
  - symptom_group: "生成的Word/PDF图片错位、乱码、文件内容异常"
    strategies:
      - step: 1
        action: "导出日志反馈"
        detail: "在设置→关于→日志打包导出日志，提交给客服排查。文件内容异常通常需要日志定位具体原因。"

    fallback: "请导出日志提交给客服排查。"

  # ══════════════════════════════════════════════
  # 症状: 敏感内容被拦截
  # ══════════════════════════════════════════════
  - symptom_group: "内容被安全拦截、提示敏感内容无法生成"
    strategies:
      - step: 1
        action: "尝试脱敏提示词"
        detail: "可在指令后补充'如果遇到敏感可以进行脱敏生成输出'或'用***代替'，但不能100%规避拦截。"

      - step: 2
        action: "反馈优化"
        detail: "建议提交case附带日志，方便优化安全围栏的精准度。误拦截问题会持续改进。"

    fallback: "安全拦截策略持续优化中，如影响正常使用请反馈附带日志。"

  # ══════════════════════════════════════════════
  # 症状: 工作空间路径问题
  # ══════════════════════════════════════════════
  - symptom_group: "工作空间路径选错了想改、路径无效"
    strategies:
      - step: 1
        action: "旧会话路径不可更改，新建会话重新选择"
        detail: "旧会话的工作空间路径不可更改，但新建会话时可以重新选择工作空间路径。"

      - step: 2
        action: "工作空间目录被移动或删除"
        detail: "如果工作空间目录被手动移动或删除导致路径无效，需要重新设置工作空间路径。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"

  # ══════════════════════════════════════════════
  # 症状: 浏览器自动化工具掉线
  # ══════════════════════════════════════════════
  - symptom_group: "浏览器自动化工具掉线、浏览器操作无响应"
    strategies:
      - step: 1
        action: "让智能体自查浏览器工具状态"
        detail: "可以让智能体自行检查浏览器工具是否在线，有时候工具状态异常但可以自动恢复。"

      - step: 2
        action: "重启客户端"
        detail: "关闭软件后重新打开，浏览器工具会在启动时自动重新初始化。"

    fallback: "如以上均无效，请加入用户群联系官方人员排查。"
