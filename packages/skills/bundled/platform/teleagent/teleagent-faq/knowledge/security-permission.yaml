categories:
- name: 权限与安全
  items:
  - q: 敏感问题既不回复也没有拦截提示一直卡住
    a: 安全围栏判断结果可能未及时呈现。可能出现智能体认为不敏感但被安全围栏静默拦截的情况。建议等待片刻后重新尝试，或换一种方式提问。
    status: 修复中
  - q: TeleAgent自动执行了高权限操作感觉不安全
    a: 您好！为了保障您的数据安全，所有高危操作都有独立弹窗提醒授权，用户可以在弹窗中选择允许或拒绝。如果确认不需要某项权限，直接拒绝即可。如有其他问题请联系在线客服！
    status: 已解决
  - q: 用管理员权限打开仍提示权限不足
    a: 当前暂未定位到具体原因。如遇到此问题，请提供错误截图和系统信息，以便研发排查。
    status: 定位中
  - q: 系统未经授权对桌面文件进行了读写
    a: 目前文件读写操作均需用户授权。如遇疑似未授权操作，请提供日志以便定位分析。可在设置中检查权限配置。
    status: 定位中
  - q: 设置了工作目录但智能体还是操作了工作目录外的文件
    a: 在经过用户授权的情况下，TeleAgent可以访问工作目录外的文件夹（部分专业目录不需额外授权）。后续版本将上线沙盒模式，支持用户严格控制访问范围。文件操作会产生授权请求，用户可按需允许或拒绝。
    status: 规划中
  - q: TeleAgent访问OA系统是否有数据泄露风险
    a: 您好！请您放心，星辰超级智能体接入私有推理池，数据不出域、不泄露至外部，满足企业数据安全要求。如有其他问题请联系在线客服！
    status: 已解决
  - q: 正常问题被安全围栏拦截了
    a: 临时可在Prompt后加"如果遇到敏感可以进行脱敏生成输出"或"用***代替"，但不能100%规避。建议报case附带日志，方便优化安全围栏效果。
    status: 优化中
  - q: 在Mac上，使用TeleAgent建OneDrive目录作工作空间报错？
    a: 您好！我们不建议在TeleAgent中使用OneDrive这类特殊目录作为工作空间，请您先更换为一个普通目录尝试。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 1.1.3升级后频繁弹授权窗口怎么办？
    a: 1.1.3安全策略加码，涉及到文件夹操作都需要用户授权。点击始终允许后同类型操作不会再弹。如果授权窗口反复弹出或授权不存在的目录，可能是模型幻觉导致，可以让智能体反思。目前正与安全部门协商豁免方案
    status: 优化中
  - q: 安全软件（天翼安全/云镜/火绒/UniAccess等）误拦截
    a: 属于误伤，需手动信任或将TeleAgent加入白名单；云镜提示病毒是误识别，关闭杀毒软件重试；UniAccess通过dll注入导致崩溃需找IT管理员开白
    status: 临时方案
  - q: TeleAgent调用大模型是否安全？
    a: 您好！TeleAgent是通过互联网访问大模型服务的，优先调用电信AI公司的专有资源池，满负载时调用模型原厂API，均保证日志不落盘，保证数据安全。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent能否在工作电脑部署？
    a: 您好！可以的，集团已明确将全力推动TeleAgent规模使用，如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent桌面版读取本地文件是否在服务器端有保留
    a: 您好！文件仅存在本地，不会传服务端。如有其他问题请联系在线客服！
    status: 已解决
  - q: 手机号注册显示已注册但重置密码报错说不存在
    a: 在teleai.com.cn尝试处理，TeleAgent账户与开放平台对齐
    status: 排查中
  - q: 注销手机号后TeleAgent本地日志还在吗？
    a: 您好！手机号只是登录方案，不影响本地存储。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent电信员工和外部客户限额一样吗？
    a: 您好！内外限额一样，未来会推出电信员工专属套餐。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 同一PC切换账号之前内容还在？
    a: 默认同一Windows用户下数据共享，退出清空功能正在开发
    status: 优化中
  - q: 智能体访问OA系统提示安全原因无法访问
    a: 安全侧不允许超级智能体对接邮件系统
    status: 暂无计划
  - q: TeleAgent是否基于openclaw安全评估如何？
    a: 您好！TeleAgent不是基于openclaw，已通过电信研究院安全评估。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent工具时模型自动举例涉政内容触发安全围栏，导致会话无法继续使用
    a: 您好！模型回答中出现涉政内容会被安全围栏拦截，建议新建任务重新操作。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 微信数据库破解技能是否有安全风险
    a: GitHub项目已被微信官方封禁，不建议使用
    status: 使用引导
  - q: TeleAgent报错“检测到您的Token消耗异常，星辰预置模型已被禁”
    a: 存在违规使用行为，如果想申诉解封，请发邮件到 teleagent@chinatelecom.cn
    status: 已解决
