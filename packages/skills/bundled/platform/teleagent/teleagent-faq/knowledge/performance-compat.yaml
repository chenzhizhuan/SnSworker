categories:
- name: 性能与兼容
  items:
  - q: 8GB内存的电脑能不能用？经常卡顿崩溃
    a: '可以使用但需注意：

      1. 同时打开的对话建议不超过10个，用完及时关闭

      2. 避免在一个对话中累积太多内容，分多个对话处理

      3. 不要同时开多个工作空间

      4. 如经常崩溃，临时方案是删除旧对话释放数据量

      建议升级到最新版。'
    status: 优化中
  - q: 云电脑上豆包能用，为什么TeleAgent不行
    a: 您好！豆包是纯云端应用不依赖本地计算资源。TeleAgent除了大模型外全部运行在本地，以满足企业数据安全需求，因此对机器性能有一定要求（需CPU支持AVX指令集）。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent升级后工作空间文件被删除了
    a: 给您带来不便非常抱歉，如果工作空间设置在软件安装目录下，升级安装时可能被覆盖清除。1.1.4版本已添加防呆设计进行提醒。建议将工作空间设置在非安装目录下。2.0版本升级后工作空间路径会重置，但旧工作空间不会删除，可在新建任务时重新选择。如有其他问题请联系在线客服！
    status: 已解决
  - q: 华为鸿蒙虚拟机上无法使用
    a: '华为鸿蒙StratoVirt虚拟机存在系统时钟不稳定和ARM模拟x64性能不足的问题，会导致大量超时。

      建议：优先同步虚拟机系统时间并重启应用。'
    status: 临时方案
  - q: 安装TeleAgent后电脑特别卡
    a: 给您带来不便非常抱歉，您可以升级最新版本即可。如有其他问题请联系在线客服！
    status: 已解决
  - q: 平板Windows电脑能不能用
    a: 星辰超级智能体目前不适配平板电脑，暂无开发计划。
    status: 暂无计划
  - q: 使用TeleAgent磁盘空间不足出现各种异常
    a: '您好！磁盘空间不足会导致多种问题（企业微信崩溃、对话写入失败、服务启动异常等）。

      1. 清理磁盘确保至少1GB可用空间

      2. 检查工作空间目录和 %APPDATA%\teleai-super-agent 所在磁盘空间

      3. 清理后重启应用。

      如有其他问题请联系在线客服！'
    status: 使用引导
  - q: 云电脑/虚拟机上安装TeleAgent提示版本不够不能用
    a: 您好！天翼云电脑需安装 Windows Server 2019及以上版本镜像。Windows Server 2016等低版本内核不支持，是底层运行时的系统要求限制。在云电脑配置-镜像中更换为2019/2022 Server镜像即可。推荐联系云电脑官方升级操作系统。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent模型感觉降智，同对话失忆
    a: 您好！模型未换，属于概率问题，建议您通过构建更完善的技能（Skill）或记忆体系来规范对话流程，以获得更稳定的回答。如有其他问题请联系在线客服！
    status: 已解决
  - q: 重装TeleAgent后报workspace变动无法启动
    a: 您好！卸载后需删除遗留文件夹再重装。如有其他问题请联系在线客服！
    status: 已解决
  - q: 云电脑安装TeleAgent失败/无法运行
    a: 您好！云电脑需Windows Server 2019/2022，CPU需支持AVX指令集；请在云电脑配置-镜像中更换为2019/2022 server镜像。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 硬盘存储消耗快
    a: im日志下个版本会处理，teleai-super-agent旧目录可删除
    status: 优化中
  - q: 文档处理不出结果/卡死
    a: 可能原因：模型服务扩容/模型负载高。处理：手动停止后追加继续执行指令；或新建任务处理；建议更新到最新版本。
    status: 优化中
  - q: 复杂表格数据处理运行很久后停止？
    a: 可能是任务超时或资源不足导致，建议拆分数据分批处理
    status: 排查中
  - q: 本地模型(mmlx/qwen3.6-35b)访问报404 Not Found
    a: 检查中转baseurl和key是否正确
    status: 已解决
