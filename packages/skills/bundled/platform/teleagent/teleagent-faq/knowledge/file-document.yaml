categories:
- name: 文件与文档
  items:
  - q: 二次修改文档内容后格式乱了没有填到正确位置
    a: 已知问题，技能能力正在持续更新优化。建议二次修改时明确指定修改内容和位置，减少格式错乱概率。
    status: 优化中
  - q: TeleAgent任务执行很慢简单任务也要等很久
    a: 您好！多工具调用类任务（如深度研究、文档生成）执行时间较长属于正常现象。如果是简单任务（如定时提醒）响应较慢，该类场景正在专项优化中。如果任务卡在某个阶段超过5分钟停滞不动则属于异常，请按任务卡住相关方案处理。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent无法读取PDF文件
    a: 您好！建议您配置PaddleOCR免费Token以获得更好的PDF处理效果。未配置时，智能体会降级使用其他方式处理PDF，可能导致处理失败或效果不佳。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent能一次@多个文件或@文件夹吗
    a: 您好！可以的。在我们的最新版本中，您已经可以一次性 @ 整个文件夹，或者按住 Ctrl/Cmd 键选择多个文件进行引用。建议您升级到最新版本以获得更好的体验。如有其他问题请联系在线客服！
    status: 已解决
  - q: 能显示任务预估剩余时间吗
    a: 底层原理决定了无法准确预估完成时间。目前已展示完整的计划步骤与各步骤执行状态，帮助您了解任务进展。
    status: 暂无计划
  - q: TeleAgent读取文件后在文件中留下了AI水印我没有要求编辑/怎么去除水印？
    a: 您好！AI打标是网信办规定，目前系统采用显隐性AI标识对文件打标。可在设置-基础设置中关闭AIGC 标识设置，关闭后输出文件不再带有可见水印，但仍含隐性标识（用于合规追溯）。如有其他问题请联系在线客服！
    status: 已解决
  - q: Word文档排版不理想序号无法调整
    a: 文档排版能力正在持续优化。建议生成后明确告知需要调整的具体格式要求，智能体会按需求修正。
    status: 优化中
  - q: 内置浏览器下载文件丢失/打不开
    a: 文件大小不对即未成功，告知AI让其自行解决
    status: 临时方案
  - q: TeleAgent支持截图粘贴功能吗？
    a: 您好！是支持截图直接粘贴发送，无需手动保存。如有其他问题请联系在线客服！
    status: 已解决
  - q: 版本升级后指定文件夹被覆盖丢失/对话记录无法打开
    a: 旧文件夹不应被删，可手动创建恢复；历史记忆不会丢失
    status: 排查中
  - q: 使用TeleAgent，C盘庞大的日志文件可以删除吗
    a: 您好！可以删除。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent输出文件可以自定义储存位置吗
    a: 您好！点击新建任务，对话框左下角自定义工作空间选别的盘即可。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent的memory.md总是被重置成3kb？
    a: 您好！这是系统最佳实践，memory.md需不定期压缩，保持在3KB以内效果最好。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent数据文档C盘转D盘后报错？
    a: 您好！不建议手动迁移，这会导致路径问题。如果已经迁移，需要清理残留文件后重装。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent剪切板不能粘贴图片？
    a: 您好！可能是IM截图快捷键导致或临时文件目录问题，请检查目录设置。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 文件夹已从teleai-super-agent改为TeleAgent？
    a: 您好！是的已更名。如有其他问题请联系在线客服！
    status: 已解决
  - q: 在使用TeleAgent中，如何把生成的HTML做成正式链接在手机上打开？
    a: 您好！需要告诉智能体需要支持手机端，前提需要云服务器。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 关于TeleAgent中memory文件如何复制到其他电脑复用？
    a: 您好！需要将对应memory文件复制到目标电脑的tools文件夹中即可。如有其他问题请联系在线客服！
    status: 使用引导
