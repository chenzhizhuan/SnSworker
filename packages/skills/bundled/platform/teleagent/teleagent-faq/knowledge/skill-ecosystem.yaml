categories:
- name: 技能生态
  items:
  - q: TeleAgent内置技能太少了哪里可以找更多技能
    a: 您好！目前已开放技能广场，支持浏览和下载其他用户分享的优质技能，也支持自主创建技能并上传分享。如有其他问题请联系在线客服！
    status: 已解决
  - q: 内置技能有没有天翼AI平台能力配置
    a: 目前已配置"星辰慧记"技能，更多天翼AI平台能力正在对接中，详情可咨询商务团队。
    status: 规划中
  - q: 使用TeleAgent导入技能后显示"审核中"任务列表一堆审核提示
    a: 您好！升级最新版本即可解决此问题。如有其他问题请联系在线客服！
    status: 已解决
  - q: 技能包导入后无法覆盖已有技能
    a: 当前设计如此，同名技能无法覆盖导入。如需更新，建议先删除旧技能再导入新版。
    status: 暂无计划
  - q: 智能打印出来的材料有断层/内容缺失
    a: 建议使用电脑直接打印文件效果更稳定。智能打印功能正在优化中。
    status: 定位中
  - q: TeleAgent版本升级后无法导出技能
    a: 您好！无需手动导出，可以直接让智能体把结果文件复制到本地即可使用。如有其他问题请联系在线客服！
    status: 已解决
  - q: 技能广场可以做分类吗？
    a: 已在开发中，后续会支持分类展示
    status: 规划中
  - q: TeleAgent网页版能导入技能广场的技能吗？
    a: 暂时不可以
    status: 暂无计划
  - q: TeleAgent技能广场技能页面加载不出来？
    a: 您好！技能页面加载不出来通常为网络原因，检查右上角小圆点是否为绿色。退出重新进入试试。如有其他问题请联系在线客服！
    status: 已解决
  - q: 有没有飞书/企业微信的技能
    a: 需区分 IM 远程连接还是访问飞书/钉钉的文档等功能。对于 IM 远程连接，预计飞书在一个月内上线，钉钉两个月内。针对完整功能对接，当前可装飞书CLI试用（非标准产品化功能），标准对接预计两个月内上线，钉钉暂无计划。
    status: 规划中
  - q: 使用TeleAgent从GitHub下载的skill导入提示没有skill.md？
    a: 您好！导入技能有一个基础要求，即文件包中必须包含 SKILL.md 文件，否则系统无法读取技能信息。部分开源技能可能不包含此文件，请您检查并补充后重试。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent技能上传后需要重启客户端才能识别？
    a: 您好！是的，重启时会有自检机制检测新安装的skill。此限制暂时无法绕过。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent技能怎么发布到技能广场？
    a: '您好！发布步骤如下：

      1. 先将技能导入到“我的技能”；

      2. 点击“申请上架”提交审核。

      请注意，上传的技能必须包含 SKILL.md 文件！如有其他问题请联系在线客服！'
    status: 已解决
  - q: TeleAgent全量输出文件内容，上下文可能炸
    a: 通过提示词软约束，在query中强调不要全输出
    status: 临时方案
  - q: 使用TeleAgent技能搜索框找不到已导入技能？
    a: 您好！这可能是TeleAgent的缓存问题，请您退出程序后重新打开尝试。如果问题依旧，可能需要重启以触发自审机制。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent的Skill怎么导出给同事用？
    a: 您好！您可以让同事在本地找到TeleAgent的skill安装包发送给您，也可以直接让TeleAgent帮您查找安装包的位置。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent内置技能为什么在技能列表里看不到？
    a: 您好！TeleAgent的内置技能（如office三件套）不会直接展示在技能列表中，您在指令中要求使用即可。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent技能怎么发布/导入为什么失败？
    a: 您好！TeleAgent的技能文件夹导入后消失是正常现象，导入成功后会出现在技能列表中（可能不在“我的技能”中），发任务时在指令里使用即可。找不到可检查技能广场或重新安装。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent技能广场的skill安全吗？
    a: 您好！TeleAgent技能广场的Skill都经过官方安全审查（恶意代码、超额权限等），可放心使用。第三方Skill也需经安全审查才能在本地启用。预制skill能解决80%以上问题。后续会上架企业专属技能，按租户模式隔离，企业可限定可见范围。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 在TeleAgent添加技能后我的技能里看不到？
    a: "您好！在TeleAgent中可能有以下几种情况：\n1) 是内置技能，不需要手动@。 \n2) 环境变量被异常阻断，请退出重开。\n3) 技能加载延迟，请重启。\n4) 让TeleAgent自己查找skill文件夹位置。\n如有其他问题请联系在线客服！"
    status: 使用引导
  - q: TeleAgent技能上架后怎么更新？
    a: 您好！目前TeleAgent暂未向开发者开放更新能力，预计7月开放。临时方案1：下架→删除→导入新技能→上架；方案2：取新名字上架，如ABC_2。
    status: 使用引导
  - q: 技能孵化器打包的技能目录路径错误（旧版teleai-super-agent）
    a: 已知问题，技能孵化器没跟着版本更新，手动把技能文件复制到新版TeleAgent目录即可
    status: 修复中
  - q: TeleAgent能否使用网上开源skill
    a: 您好！可以的。如有其他问题请联系在线客服！
    status: 已解决
  - q: 预置技能如何删除？
    a: 预置技能暂不支持删除只能停用
    status: 已解决
  - q: TeleAgent的PPT技能转换图片消耗token多？
    a: 您好！旗舰模式用内置工具替换执行，时间长，消耗token多，建议您合理规划。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent有本地知识库吗？
    a: 您好！无内置功能，您可在技能广场搜索相关技能。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent的GitHub开源PPT技能需要GPT吗？
    a: 您好！默认使用GPT，但智能体会自动调整为内置工具，不影响使用。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 导入技能一直审查中怎么办？
    a: 删除.config/TeleAgent/skills下对应技能包，重启后重新导入
    status: 临时方案
  - q: 使用TeleAgent有npx服务吗？
    a: 您好！可以直接发任务，智能体会根据需要自动调用和安装。如有其他问题请联系在线客服！
    status: 已解决
  - q: 本地存放skill的文件夹路径能否更换？
    a: 暂时不能更换，支持自定义路径涉及较大重构，暂无计划
    status: 暂无计划
  - q: 技能开发环境搭建
    a: 需使用Node v20，与v22/v24存在兼容问题
    status: 使用引导
  - q: skill调用的机制是什么
    a: 添加后系统根据用户问题自动匹配并调用
    status: 使用引导
