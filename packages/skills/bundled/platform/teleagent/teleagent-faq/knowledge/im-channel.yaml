categories:
- name: IM渠道
  items:
  - q: IM渠道无法切换工作目录
    a: 后续版本IM 渠道会话将支持对普通任务会话的感知和调度，而普通任务的工作目录是可以自行定义的，敬请关注更新。
    status: 规划中
  - q: 企业微信显示"连接中"但实际没连上
    a: '通常是企微凭证失效但应用未检测到。

      解决步骤：

      1. 退出应用

      2. 删除 %APPDATA%\teleai-super-agent\im-service\wecom-state.json

      3. 重启应用，重新配置企微凭证

      4. 如凭证已失效，需重新获取有效凭证再配置'
    status: 已解决
  - q: 微信或企业微信对话后收不到文件
    a: 尝试发送"把上次对话生成的文件再发给我一遍"即可重新接收文件。
    status: 临时方案
  - q: 微信消息发不出去/对方收不到但应用没报错
    a: '已知消息发送静默失败问题。

      处理：

      1. 删除 weixin-state.json 重置连接状态（路径同上）

      2. 重启应用重新连接

      3. 发送重要消息后，建议通过其他渠道确认对方是否收到

      后续版本会增加发送确认机制。'
    status: 规划中
  - q: 使用TeleAgent微信聊天结果不满意
    a: 您好！请明确告诉智能体“不要按照上次的方式生成，不要使用上次的脚本，重新编写并生成”，它会按新方式重新处理。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 微信二维码刷不出来一直转圈
    a: '通常是之前的连接状态未正确清理。解决步骤：

      1. 完全退出应用（托盘右键退出）

      2. 打开 %APPDATA%\teleai-super-agent\im-service\

      3. 删除 weixin-state.json 文件（删除后不影响其他数据，重启会自动重建）

      4. 重启应用，重新扫码连接'
    status: 临时方案
  - q: TeleAgent能否通过API接口接入钉钉机器人？
    a: 您好！目前我们暂未开放通用的 API 接口。我们正在规划 SDK 接入方式，并会按照排期逐步接入钉钉等 IM 类软件。敬请期待后续更新。如有其他问题请联系在线客服！
    status: 已解决
  - q: 微信发送第二条指令后台看不到？
    a: 当前设计需要等上一条指令完成输出后再执行下一条，微信端暂不支持打断/插话，优化方案在设计中
    status: 暂无计划
  - q: 飞书如何对接TeleAgent
    a: 您好！需要飞书建机器人，把ID和密码告诉TeleAgent，会自动桥接并建守护进程。如有其他问题请联系在线客服！
    status: 已解决
  - q: 量子密信对接TeleAgent
    a: 您好！需要给TeleAgent读quantum-im-bridge-whitepaper即可桥接。如有其他问题请联系在线客服！
    status: 已解决
  - q: 量子密信群部署机器人是否安全
    a: 您好！量子密信只是作为控制TeleAgent的入口，是否安全取决于具体的指令或人员本身。如有其他问题请联系在线客服！
    status: 已解决
  - q: 微信IM无执行状态反馈？
    a: 已有优化方案开发中，后续会像飞书一样显示'正在输入'等状态
    status: 规划中
  - q: 微信对话与桌面端对话不互通？
    a: 当前微信通道和桌面端是独立会话，微信中说的内容在桌面端回顾时AI不知道。此为已知限制
    status: 暂无计划
  - q: IM通道需要PC端授权时卡死
    a: 当前版本需到桌面端手动确认授权弹窗，下一期会支持微信端自然语言确认
    status: 规划中
  - q: 权限弹窗过于频繁
    a: 后续计划添加全局授权功能，一次授权后不用再重复点击
    status: 规划中
  - q: 微信clawbot名称含有claw字眼被网信安通报
    a: 微信侧的名称无法由我们控制，已在规划量子密信接入
    status: 暂无计划
  - q: 断开微信重连报多个bot错误
    a: 需清理微信bot设置，重新扫码连接
    status: 临时方案
  - q: 微信IM上下文压缩占满后无法再对话
    a: 临时可删im-service目录后重启；6月底版本会支持IM会话调度和任务删除
    status: 临时方案
  - q: 微信交互能否切换不同任务
    a: 二三期IM连接逐步支持，目前建议客户端切换任务
    status: 规划中
  - q: 通讯工具有支持接入量子密信吗
    a: 有计划，估计七八月份
    status: 规划中
  - q: 微信会话能否拆分为多个会话？
    a: 需要和微信官方合作确定方案，正在尝试推进中
    status: 规划中
  - q: 微信会话能否清空？
    a: 下版本会提供清空微信会话功能
    status: 优化中
  - q: 即时通信输入没有反应怎么办？
    a: 通讯断联导致，重新连接即可
    status: 修复中
  - q: 微信发文件给teleagent收不到？
    a: 暂不支持通过IM传文件，7月初版本将支持
    status: 规划中
  - q: TeleAgent微信远程控制是什么原理？
    a: 您好！通过微信给Agent发送指令，由Agent操作其所在的电脑；智能体无法直接操作微信发送文件，但微信API向ClawBot开放了文件功能。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 微信连TeleAgent电脑关闭后发消息没有回复？
    a: 您好！关闭TeleAgent后不会再有回复，这是正常行为。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 配置企业微信后如何使用关于TeleAgent？能做什么？
    a: 您好！可以通过企业微信给智能体发消息让智能体完成工作，适合不带电脑出门时使用。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent能否通过API接口调用企微里的数据？
    a: 您好！如果能获取微信或企微的接口，智能体就能处理的。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 云电脑使用微信助手出问题无法正常使用
    a: 删除im-service下blocking-state.json等文件，或重启云电脑
    status: 临时方案
