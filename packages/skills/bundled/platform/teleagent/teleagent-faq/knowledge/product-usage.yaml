categories:
- name: 产品与使用建议
  items:
  - q: 使用TeleAgent，UI层级不明确文件和技能看不出归属关系
    a: 您好！请升级最新版本，最新版本文件引用与技能引用已分开显示。如有其他问题请联系在线客服！
    status: 已解决
  - q: 功能太多了不知道怎么用缺乏引导
    a: '功能引导正在优化中。当前可通过以下方式快速上手：

      1. 首次使用时跟随引导流程

      2. 在对话框中直接用自然语言描述需求

      3. 访问官方课程了解更多功能'
    status: 优化中
  - q: 安装包字体有点模糊
    a: 可能是系统分辨率设置问题，建议检查Windows显示缩放比例。部分场景下确有字体渲染问题，暂无专项优化计划。
    status: 暂无计划
  - q: TeleAgent是纯自研的吗
    a: 您好！TeleAgent是由中国电信自主研发的产品，如有其他疑问请联系官方客服。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent工作空间路径设置后能改吗
    a: 您好！正在运行任务的工作空间不支持修改路径。新建任务时在左下角重新选择工作空间，旧会话工作空间路径暂不支持修改。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent现有的宣传材料在哪里获取
    a: '您好！产品介绍PPT：百度网盘 https://pan.baidu.com/s/1uj3zyrvMHhKSXL8d83D_kA 提取码 ige2

      课程介绍：https://weixin.qq.com/sph/AJUT05yTgV

      如有其他问题请联系在线客服！'
    status: 已解决
  - q: 子用户是什么意思？
    a: 您好！天翼AI开放平台的企业管理员可给员工发放子用户，通过子用户登录超级智能体，企业可统一管理使用情况。该企业租户相关功能尚在设计中。如有其他问题请联系在线客服！
    status: 已解决
  - q: 微信通过Clawbot使用时看不到本地任务结果？
    a: 微信等 IM 渠道跟普通任务是相隔离的两套智能体，所以它无法直接看到本地普通任务结果。这块相关的优化我们已经在排期做了，预计一个月内上线。
    status: 规划中
  - q: TeleAgent支持天翼云息壤的API接入吗？
    a: 您好！天翼云Token Plan和息壤的URL不同，模型也不同。息壤按量计费需自定义model provider。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent是否通过安全认证？
    a: 您好！TeleAgent是首批通过中国信通院企业级类Claw智能体安全能力认证，入选可信清单。如有其他问题请联系在线客服！
    status: 已解决
  - q: 天翼云Token Plan怎么配置？
    a: 您好！可以按如下步骤操作：升级到1.1.2及以上版本 -> 设置 -> 模型设置 -> 可用 -> 天翼云Token Plan -> 填写KEY。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent当前免费的模型算力由谁提供？
    a: 您好！目前由电信AI公司的算力池提供。如需使用其他模型需自行到对应大模型官网购买API服务。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent指定的工作空间文件夹和操作其他文件夹是什么关系？
    a: 您好！工作空间是智能体的默认存储和操作位置。如果您需要读取或操作工作空间以外的其他文件夹，智能体一定会征求您的明确授权，保障您的文件安全。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent默认模型API变更后Model not found怎么办？
    a: 您好！默认模型的API有调整时需手动重新选择一下模型即可。如有其他问题请联系在线客服！
    status: 已解决
  - q: 能否通过API或脚本访问星辰智能体
    a: 目前不可以，后续规划了SDK模式，预计8月支持，API暂不考虑（入参管理复杂度高）
    status: 规划中
  - q: TeleAgent可以像浏览器一样打开网页填写信息吗
    a: 您好！可以用浏览器自动化MCP实现。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent删除对话会删掉智能体记忆吗
    a: 您好！删除对话不会删除记忆，想忘掉内容可以直接跟TeleAgent沟通。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent配置自己的模型服务后其他功能会受影响吗
    a: 您好！忽略模型能力差异，其他功能不受影响。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent自定义模型API如何配置？
    a: 您好！最新版本已支持，需要在模型设置中配置base url、api key和model id即可。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent旗舰模型效果为什么不稳定？
    a: 您好！TeleAgent的旗舰模型是一组模型的集合，会根据任务内容动态调度。主任务模型是稳定的，效果不稳定大概率是因为缺乏明确的指令约束。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent模型月度套餐专属API key无法识别？
    a: 您好！TeleAgent月度套餐的base url与常规API不同，请您配置正确的base url地址。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent归档功能是什么？
    a: 您好！将不需要短期查看的已执行任务存到收藏夹，侧边栏不再显示。可在设置-归档任务中取消归档恢复到侧边栏。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent自定义模型配置后报错怎么办？
    a: '您好！请按以下步骤排查：

      1) 检查base url、api key和model id是否正确；

      2) 确认网络连通性；

      3) 用默认模型让TeleAgent自行诊断；

      4) 如本地模型确认是模型本身问题则需换模型。

      如有其他问题请联系在线客服！'
    status: 使用引导
  - q: 关于TeleAgent旗舰模型和快速模型是什么？
    a: 您好！TeleAgent的旗舰模型是一组模型的集合，会根据任务内容动态调度，适合复杂推理、深度调研、长文本生成，但速度较慢。快速模型效率更高，适合简单任务。具体模型属于商业机密。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent生成PPT太慢怎么办？
    a: 您好！建议您明确告诉TeleAgent使用PPT技能；旗舰模型制作PPT较慢，可更换为极速模型；对于展示类内容，首推HTML格式，视觉效果更好。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 跨设备记忆迁移怎么做？
    a: 数据强绑定设备不绑定用户。方案：1)让Teleagent自己出迁移方案和提示词，两台终端执行迁移；2)技能广场有迁移技能可直接用；3)备份 C:\Users\用户名\.local\share\teleai-super-agent\memory\
      和 scheduler\ 目录，加上 user-agent-config.json 和 skills-metadata.json，复制到新设备对应路径；4)端云协同在设计中，后续永久跟随账户
    status: 规划中
  - q: 私有化部署最低算力要求？
    a: 最低需要能部署GLM-5.1(7800亿参数)加一些小尺寸模型(1000亿参数)，服务器成本约300-400万。如客户自备GPU+大模型，最低档次也得是DeepSeek-V4-Pro，推荐GLM-5.1
    status: 规划中
  - q: 微信/企微能发图片和文件吗？
    a: 目前只支持纯文本，不支持图片、音频和文件。正在升级支持发送文件。
    status: 修复中
  - q: TeleAgent的量子密信能发群消息吗？
    a: 您好！TeleAgent的量子密信仅支持单聊，不支持群聊。如需群发消息，需要在群里添加webhook机器人进行推送。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 内网/代理环境无法使用TeleAgent怎么办？
    a: 产品服务端在公网，纯内网环境无法使用。装代理软件可能引入登录失败和连接问题。建议：1)为服务端加IP白名单 2)用手机热点临时解决登录问题 3)等待后续版本优化代理兼容性
    status: 定位中
  - q: TeleAgent生成PPT效果不好怎么办？
    a: '您好！您可以尝试以下方法优化TeleAgent的PPT效果：

      1) 提供自己的模板让智能体套用，素材越充分效果越好。

      2) 用星辰写提纲，再用Kimi/GLM的PPT模式生成。

      3) 展示类内容推荐HTML格式。

      4) PPT做不出“国企味”是AI的普遍局限。

      如有其他问题请联系在线客服！'
    status: 使用引导
  - q: 桌面版图标能更换吗？
    a: 目前不支持更换桌面图标
    status: 暂无计划
  - q: TeleAgent客户端能自动升级吗？
    a: 您好！目前我们推荐您手动升级TeleAgent。自动升级通常会比手动升级慢一个版本。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 用户名能改中文吗？
    a: 目前不支持中文用户名，需求已提交合作团队
    status: 规划中
  - q: 集团是否正式发文允许使用TeleAgent？/地方政府网信安不让推TeleAgent怎么办？
    a: 您好！是的。集团已明确表态全面大力推广，集团战略与改革专班已发文通知全集团单位推广使用，网信安已通过电信研究院安全评测，各省网信安部门应有收到邮件。如有疑问可让公司领导确认战略部通知！
    status: 已解决
  - q: TeleAgent技能广场上架技能提示敏感信息风险怎么办？
    a: 您好！TeleAgent的安全审查检测到密码相关关键字时会提示风险，不影响使用可忽略。消除方法：下载skill修改密码相关关键字、让TeleAgent改造skill、或联系刘海敏协助。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent的微信/企微能不能自动获取群聊消息？
    a: 您好！不能。微信和企微对群聊限制很大，TeleAgent获取聊天记录没有合规方式，且容易导致封号。曾有开发者做过相关skill，但会触发风控导致封号。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 使用TeleAgent，imap-smtp-email能否对接集团@chinatelecom.cn邮箱？
    a: 您好！可以。需在集团邮箱配置访问密码后开启SSL验证。XJ研发云测试可用。但网信安不建议让智能体操作邮箱（可能误开钓鱼邮件）。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent怎么实现OA对接？
    a: 您好！目前TeleAgent在提供OA网址后需要手动输入账号密码。您也可以通过MCP接口方式，让OA开发接口后由智能体接入，在设置-工具设置中添加MCP。请注意，安全性需充分评估。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent中Chatbot和Agent的区别？为什么要慢？
    a: 您好！在TeleAgent中，Chatbot强调快速问答，而Agent用于处理文件类任务，这类任务人工可能需要半小时到一小时。因此Agent整个过程比聊天AI长是正常的。提示词准确度和模型选择也会影响速度。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent能不能接入本地模型？
    a: '您好，部署时请选择带鉴权的 API，随后进入设置 - 模型设置页面添加模型提供商。

      私有化部署有对应要求：所用大模型上下文至少支持 200k，算力相关成本预估三到四百万元如有其他问题请联系在线客服！'
    status: 已解决
  - q: TeleAgent客户端自带语音模型吗？
    a: 您好！暂时没有。短时间内建议您使用豆包输入法等工具代替TeleAgent的语音输入。语音输出暂时没有替代方案。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 如何重装TeleAgent？
    a: '您好！请按以下步骤操作：

      1、完全退出应用。

      2、删除整个用户数据目录：C:\Users\APPLE\.local\share\TeleAgent\（整个文件夹）。

      3、删除配置目录：C:\Users\APPLE\.config\TeleAgent\。

      4、在控制面板卸载所有 TeleAgent/TeleClaw。

      5、重新下载安装，只安装一个目录。

      如有其他问题请联系在线客服！'
    status: 使用引导
  - q: TeleAgent升级2.0后工作空间变更到C盘
    a: 您好！新版本默认工作空间会重置，您可在新建任务时重新选择原来的工作空间路径。旧工作空间不会删除，旧任务可通过复制粘贴迁移到新工作空间。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent不同任务间上下文串扰
    a: 您好！TeleAgent的长期记忆功能会在上下文中注入最近任务的摘要，如您不需要，可在指令中加上“不要使用历史记忆信息”。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 数据是否跟账号绑定？支持多设备同步吗？
    a: 云同步方案已完成内部评审，预计7月份上线
    status: 规划中
  - q: 网信安不允许安装TeleAgent
    a: 您好！集团已明确要推广使用TeleAgent，正式通知即将下发。如有其他问题请联系在线客服！
    status: 已解决
  - q: 对话列表没有日期显示/无法批量删除
    a: 目前还未支持，后续会考虑
    status: 优化中
  - q: memory.md文件经常被清空
    a: 更新、卡登录界面退出、上下文过长都可能导致记忆清空，正在重构底层引擎
    status: 排查中
  - q: 使用TeleAgent，如何查看Token用量统计？
    a: 您好！请在设置-用量统计查看，如有其他问题请联系在线客服！
    status: 已解决
  - q: 支持跨平台工作区迁移吗？
    a: 暂不支持，后续支持多设备同步；临时可让TeleAgent帮做迁移方案
    status: 规划中
  - q: 什么时候支持麒麟系统/信创环境
    a: 会有适配版本，在开发中，预计七八月份
    status: 规划中
  - q: 有手机版吗
    a: 有规划，估计七八月份
    status: 暂无计划
  - q: 有xc(信创)电脑适配排期吗
    a: 已经在开发中，具体发布时间后续同步
    status: 规划中
  - q: TeleAgent汇报网页只有5种风格版本
    a: 您好！这是技能内部风格数量的限制，您可按需扩展技能，增加自己想要的风格。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 能否增加自定义agent和集群agent
    a: 有考虑，会评估后跟进业内最佳实践持续提升
    status: 规划中
  - q: TeleAgent并发有限制吗
    a: 您好！目前并发限制3个任务。如有其他问题请联系在线客服！
    status: 已解决
  - q: AI有token限制吗
    a: 暂时没限制，免费使用期
    status: 已解决
  - q: 还有空的交流群吗
    a: '有，打开这个网址扫描里面的二维码就可以加群

      https://www.teleai.com.cn/doc/7czHMDStGDQr1JsAMKcZ/Gik5VRTWAer7xDrqNBS7'
    status: 已解决
  - q: 取消微信连接后能否显示历史对话？
    a: 下版本考虑支持不连接也能显示历史对话
    status: 规划中
  - q: TeleAgent为什么突然限额？
    a: 您好！由于用户量增长快，算力资源紧张，为保证每位用户的服务稳定性和体验质量，我们优化了资源管理机制。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent有记忆功能吗？
    a: 您好！是有的，支持长期记忆和项目记忆。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent大模型批量跑数据费token吗？
    a: 您好，若您的操作流程固定标准化，通过脚本自动化执行能够有效降低 token 消耗，提升使用效率。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent配置本地模型时模型id和名称填一样的吗？
    a: 您好！需要看模型服务封装，model_name非必填，只认model_id做路由。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent工作空间选择报错怎么解决？
    a: 您好！请勿选择系统盘或软件安装目录内的文件夹，请更换电脑本地其他磁盘文件夹存放。如有其他问题请联系在线客服！
    status: 已解决
  - q: 关于TeleAgent中chat-pro是什么
    a: 您好！chat-pro属于内置的模型，需要遵守产品内置规则，若违反会被视为系统攻击并封号。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 使用TeleAgent中token统计与第三方平台差距过大如何理解
    a: 您好！目前Token统计以大模型API原始调用量为准，建议以第三方平台统计和扣费为准。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 搜索能否基于任务回答内容搜索
    a: 目前仅支持基于名称搜索，基于内容搜索暂不支持
    status: 使用引导
  - q: 'MCP error -32000: Connection closed报错影响使用吗'
    a: 这是控制浏览器的一个工具报错，用不着不影响使用，可让TeleAgent自查修复
    status: 已解决
  - q: 网页版超级智能体什么时候上线
    a: 已经研发完了，HW结束后上线，带端云协同能力
    status: 规划中
  - q: 视觉模型识别的token限额
    a: 视觉模型识别限额与文字模型不共用同一额度池，目前没有单独限制视觉模型token
    status: 已解决
- name: 私有化部署与商务
  items:
  - q: 收费模式是什么？个人免费还是企业收费
    a: 商业化方案正在制定中尚未定稿。目前个人用户可免费使用。企业级功能（多租户、权限管控等）和私有化部署的收费模式后续会正式公布。
    status: 规划中
  - q: 支持私有化部署吗
    a: 未来会优先支持租户形式的企业服务，模型推理池在AI公司内部，保证数据安全。也支持接入自有模型。该服务涉及收费，算力成本约三四百万。
    status: 规划中
  - q: 内部员工使用超级智能体会收费吗？
    a: '理解您的担心。

      现阶段，内部员工使用是免费的。

      待集团正式启动商业化后，内部员工也会按集团统一部署有市场化策略，但我们为内部员工保留了非常充足的月度免费使用额度、能覆盖95%的员工需求。

      即使免费额度用完后，也会采用远低于市场价的方式提供续费使用。'
    status: 已解决
  - q: 云电脑完全体控制PC版本有没有公开发售
    a: 未公开发售，仅为云电脑镜像版本
    status: 已解决
  - q: 是否可以在DCN环境使用？
    a: 目前还不支持DCN内网使用，正在思考设计中
    status: 规划中
  - q: 能否兼容星海AI中台接口？
    a: 已在开发中
    status: 规划中
  - q: 政府内网能不能部署TeleAgent费用多少？
    a: 您好！该方案支持部署；因需部署大参数量模型，单次部署基础成本 300 万元起。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent知识库怎么和超级智能体结合？
    a: 您好！小的知识库可以封装到skill里，大的可以做成在线文档，公开给skill访问。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 超级智能体能本地部署吗？全内网如何注册使用？
    a: 目前暂无纯内网部署方案，正在开发自定义模型配置功能，上线后可配置内网模型服务
    status: 规划中
  - q: TeleAgent为什么突然限额？
    a: 您好！因为用户量增长快，算力资源紧张，为保证每位用户的服务稳定性和体验质量，我们优化了资源管理机制。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent限额多少？
    a: 您好！工作日8:00-20:00为8000万token，工作日0:00-8:00及20:00-24:00两个时段共用1亿token，周六日为2亿token/天。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent额度什么时候重置？
    a: 您好！每日0点重置，过零点后额度重新计算。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 关于TeleAgent闲时段额度怎么算？
    a: 您好！0:00-8:00和20:00-24:00是同一天内两个时段共用1亿额度，不是各1亿。比如凌晨用了8000万，晚上就只剩2000万。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 使用TeleAgent，我自己接入的模型也限额吗？
    a: 您好！目前仅官方模型有每日额度，您自行配置的第三方模型不受影响。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 使用TeleAgent能申请提高额度吗？
    a: 您好！目前暂不开放追加申请，额度次日自动重置。预计Q3推出充值方案。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 关于TeleAgent免费额度用完后怎么办？
    a: 您好！可以挂其他模型服务商，自行购买使用。我们也会持续评估额度标准并优化服务能力。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 关于TeleAgent额度用完了什么时候恢复？
    a: 取决于当前时段：忙时用完等20:00闲时恢复；闲时用完等次日0点重置；周末用完等次日0点。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 内网的星辰超级智能体在哪里下载
    a: 内网需等集团打通，暂时可用云电脑方式访问
    status: 规划中
  - q: 免费推广期到什么时候？
    a: 暂定6-9月免费推广，具体结束时间将根据市场竞争态势和集团部署安排确定，如有调整会提前通知。
    status: 已解决
  - q: 免费推广期间的模型限额口径
    a: 目前对外宣传的免费额度为5000万Token，内部用户实际享有更高的阶梯配额：工作日日间（8:00-20:00）8000万Token，工作日夜间两个时段（0:00-8:00及20:00-24:00）合计1亿Token，周末每天2亿Token。商业化后内外部用户策略均会有所调整，届时以最新政策为准。
    status: 已解决
