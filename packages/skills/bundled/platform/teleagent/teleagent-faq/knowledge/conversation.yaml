categories:
- name: 定时任务
  items:
  - q: 定时任务和技能设置入口太隐蔽了
    a: 已纳入优化需求，后续版本会优化高频功能的入口便捷性。
    status: 规划中
  - q: 定时任务每次都在对话列表里新建一个对话太乱了
    a: 已纳入需求规划，会优化定时任务结果的展示方式。目前同一任务的多次结果不能合并到同一个对话中，因为会导致上下文污染（前后任务内容相互干扰），建议定期手动清理已查看的定时任务对话。
    status: 规划中
  - q: 定时任务能不能发邮件通知结果
    a: 目前定时任务不支持邮件通知。定时任务的执行需要电脑处于开启状态，执行结果会在应用内查看。后续版本会评估增加通知方式。
    status: 暂无计划
  - q: 使用TeleAgent定时任务页面报错
    a: 您好！请升级新版本即可。如有其他问题请联系在线客服！
    status: 已解决
  - q: 关机后TeleAgent定时任务能否运行
    a: 您好！不能。需要电脑开机且软件处于运行状态。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 定时任务能否支持crontab规则和间隔执行？
    a: 当前仅支持固定时间设置，间隔执行（如每2小时一次）功能规划中
    status: 规划中
  - q: 定时任务能否支持每月调用2次等自定义频率？
    a: 暂不支持，可用每隔XX天替代，或通过skill判断时间再执行
    status: 临时方案
- name: 对话与交互
  items:
  - q: TeleAgent上下文窗口有多长
    a: 您好！使用官方模型时，上下文窗口为200K。如果接入自有模型，上下文长度由所接入的模型决定。如有其他问题请联系在线客服！
    status: 已解决
  - q: 任务执行中大模型思考阶段时间线不显示进度
    a: 已知问题。大模型生成内容阶段耗时较长，但时间线上可能无进度显示，容易误解为卡住。实际任务仍在执行中，请耐心等待。后续版本会优化时间线展示逻辑。
    status: 定位中
  - q: 使用TeleAgent发送后想修改问题重新提问但没有编辑选项
    a: 您好！当前支持在智能体输出过程中继续输入补充信息。发送后的消息暂不支持编辑，可以复制原问题修改后重新发送，支持对话内容复制功能。如有其他问题请联系在线客服！
    status: 已解决
  - q: 使用TeleAgent对话框怎么换行？回车就发出去了
    a: 您好！换行快捷键是 Shift+Enter。直接按Enter是发送消息。如有其他问题请联系在线客服！
    status: 已解决
  - q: 思考过程太长了答案不够全面
    a: 思考过程较长是为了保证最终结果质量，目前暂无法跳过。后续版本会优化思考过程的展示和答案的完整性。
    status: 暂无计划
  - q: 使用TeleAgent想复制之前发的内容右键没有复制选项
    a: 您好！升级到v1.1.3及以上版本，支持消息一键复制，可保留代码、表格、公式等原始格式。如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent不按我要求的称呼来叫
    a: 您好！请明确强调你的称呼要求，多提醒几次后智能体会记住。也可以在对话开始时就明确告诉它：“请称呼我为xxx”。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent回复的答案不符合预期怎么办
    a: 您好！可以明确告诉智能体你的具体要求和偏好，它会在后续对话中遵循。例如：“以后做类似任务前，先跟我确认需求再执行”。多轮交互后，智能体会逐步理解你的习惯，类似“养成”过程。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 使用TeleAgent问天气时间格式显示错误
    a: 您好！可能是模型效果问题，建议重新提问或明确指定时间格式（如“请按2026年5月29日 14:00的格式显示”）。随着模型能力提升，该问题会自然改善。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 使用TeleAgent操作WSL shell容易超时怎么办？
    a: 您好！为了避免超时，建议您在 Prompt 中使用 wsl [linux命令] 的格式。这样可以在当前 Shell 下直接执行 Linux 命令，避免通过 PowerShell 中转导致超时。如有其他问题请联系在线客服！
    status: 已解决
  - q: 思考过程显示英文/乱码能改吗？
    a: 这是模型调性问题，原因是模型在训练过程中使用了大量英文语料，且对「中文输出结果」的指令遵循不够好。新一代大模型训练中会对
    status: 规划中
  - q: 关于TeleAgent对话框字体大小怎么调整？
    a: 您好！您可以使用快捷键 Ctrl+Shift++ 放大，Ctrl+- 缩小。TeleAgent本质是浏览器，因此支持浏览器快捷键。请注意，某些电脑的快捷键可能被其他程序占用。
    status: 使用引导
  - q: TeleAgent对话历史记录翻不到上面/到头了？
    a: 您好！在TeleAgent中，您可以先向下滚动一点，再向上滚动，即可看到更多历史记录。这是已知问题，在1.1.3版本中已部分修复。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent任务卡死/一直在运行不出结果怎么办？
    a: 您好！如果TeleAgent任务超过20分钟没有结果，建议您手动暂停，然后要求智能体重新执行。如果无法暂停，可通过任务管理器结束进程。1.1.3版本已修复了部分长耗时工具卡死的问题。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent任务置顶功能有没有？
    a: 您好！1.1.3版本已支持任务置顶功能，可升级此版本，如有其他问题请联系在线客服！
    status: 已解决
  - q: TeleAgent能接入内网办公系统吗？
    a: 您好！TeleAgent可以通过浏览器自动化操作内网OA。也可以让OA开发MCP接口后，在设置-工具设置中添加。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 电脑休眠时TeleAgent还能工作吗？
    a: 您好！不能。电脑休眠等同于关机，TeleAgent的内存将停止工作。如有其他问题请联系在线客服！
    status: 使用引导
  - q: PowerShell处理中文路径/引号嵌套导致重复
    a: 是PowerShell处理中文的问题，建议做成skill或用python替换中文引号。docx skill 新版本优化中，预计可大幅减少此类问题。
    status: 修复中
  - q: 任务执行完还在转/停止后又运行
    a: 可能前端状态有问题，导出日志排查；重启进程可能挂掉需重构底层引擎
    status: 排查中
  - q: TeleAgent不经确认就修改代码文件
    a: 您好！您需在指令中强调“这个阶段只是讨论，不要修改”，或说明“只讨论不修改”。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 微信执行命令长时间无响应
    a: 可能是点进微信助手在电脑场域对话，消息不会发回微信；需断开重连
    status: 临时方案
  - q: 默认模型无法修改缺省值
    a: 目前暂不支持修改默认模型缺省值
    status: 暂无计划
  - q: 后续是否支持/new /steer等指令
    a: 暂无计划，斜杠命令对非技术用户不友好，会进一步评估
    status: 暂无计划
  - q: TeleAgent运行过程中不能实时纠正/提醒吗？
    a: 您好！合理的做法是暂停任务后，再输入纠正指令。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 输出结果只能全篇复制，选取部分文字右键无法复制
    a: 右键复制已知问题，先用Ctrl+C快捷键
    status: 修复中
  - q: 使用TeleAgent，通过OpenAI API接入千问报错max_tokens should be [1,32768]
    a: 您好！TeleAgent默认OUTPUT_TOKEN_MAX为65536，千问API上限32768；需要设置环境变量OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX=32768启动前生效。如有其他问题请联系在线客服！
    status: 已解决
  - q: 工具调用失败/执行异常怎么办？
    a: 模型并发量高可能导致，换一个任务重新执行即可
    status: 临时方案
  - q: TeleAgent对话提示未知异常怎么处理？
    a: 您好！通常是对话过长导致，您可以尝试说“请继续任务”来继续执行；或新开窗口让智能体查日志；也可将对话内容整理成提示词，转移到新对话框。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 微信插件提示正在执行任务请等待，无法发新指令
    a: 前面任务可能未执行完，建议打开智能体查看执行情况；电脑休眠可能导致阻塞超时
    status: 排查中
  - q: 写进TeleAgent记忆的规则有时不遵守？
    a: 您好！Agent有犯错的概率，建议您人工review，及时纠正并帮助其养成习惯。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent模型能不能识别桌面实时画面？
    a: 您好！不能直接获取实时界面，需要先截图再识别，所有智能体都如此。如有其他问题请联系在线客服！
    status: 使用引导
  - q: TeleAgent的AI犟脾气不听话怎么改人设？
    a: 您好！请@使用习惯技能修改偏好，直接告诉AI您希望的处理方式。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 能否设置默认浏览器？
    a: 目前主流自主操作浏览器只有谷歌支持较好，暂时无法更改
    status: 优化中
  - q: TeleAgent是否支持任务排队？
    a: 当前不支持任务排队功能
    status: 暂无计划
  - q: Playwright MCP导致上下文爆了怎么办？
    a: 终止任务，新建任务发指令读取原任务关键信息，teleagent会查本地数据库；建议高频新建任务规避
    status: 已解决
  - q: 新建任务后启动不了/系统挂了
    a: 关掉软件后台重新打开
    status: 已解决
  - q: 切换deepseek基模后多模态能力是否消失
    a: deepseek目前没有多模态能力，预期会自动使用官方预置的图像理解工具完成图像理解
    status: 已解决
  - q: 定时任务执行时指令乱码且不全
    a: 编码问题导致，建议让Agent使用UTF-8编码
    status: 已解决
