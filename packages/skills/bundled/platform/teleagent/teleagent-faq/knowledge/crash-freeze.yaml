categories:
- name: 白屏/闪退/无响应
  items:
  - q: 任务执行中卡住不动等了很久没有输出
    a: '常见原因及处理方式：

      1. 后台服务崩溃：检查右下角图标是否绿灯，红灯或无指示说明服务挂了，重启应用

      2. AI模型响应超时：模型负载高，等几分钟可能恢复；超过5分钟仍无响应，关掉该对话重新开

      3. 对话上下文过长：已聊很久的对话处理时间会变长，建议开新对话继续

      4. 网络波动导致连接断开：按F5刷新页面重连

      5. 子Agent静默等待授权：授权弹窗可能未正常显示，尝试手动暂停后重新发送指令'
    status: 修复中
  - q: 使用中出现白屏，界面全白了但是没关闭按钮
    a: '已知两类原因：


      原因一：前端页面状态异常（V1.1.1已知问题）

      表现：重启可能暂时恢复，但同一对话再打开可能又白屏

      处理：升级到最新版本可降低触发概率；如果对话数据已损坏，需删除该对话重新开


      原因二：后台服务内存超限崩溃

      表现：重启也无效，重新打开加载同样数据又崩溃

      处理：

      1. 先尝试重启应用

      2. 如重启后仍白屏，说明对话数据量过大，需删除部分旧对话

      3. 8GB内存设备建议保持对话数量在10个以内，用完及时关闭'
    status: 修复中
  - q: 创建或导入技能后反复白屏
    a: '技能冲突导致。

      处理步骤：

      1. 退出应用

      2. 删除 %APPDATA%\teleai-super-agent\skills 下的冲突技能目录

      3. 重启应用

      4. 避免导入同名技能包'
    status: 临时方案
  - q: 正在输入文字时突然白屏
    a: '当前对话数据量已偏大或后台服务内存紧张导致。

      建议：

      1. 不要在一个对话中累积太多内容，分多个对话处理不同任务

      2. 用完的对话及时关闭

      3. 8GB内存设备注意控制同时打开的对话数量（建议不超过10个）'
    status: 修复中
  - q: 白屏后重启还是白屏怎么办
    a: '重启无效是因为应用会自动加载上次的对话数据，如果数据异常就会再次白屏。

      解决方案：

      1. 完全退出应用（托盘图标右键退出，不是最小化）

      2. 按 Win+R，输入 %APPDATA%\teleai-super-agent 回车

      3. 先将该文件夹备份到桌面

      4. 卸载应用 - 删除该文件夹 - 重新安装

      注意：删除后聊天记录会丢失，请务必先备份。'
    status: 临时方案
  - q: 锁屏/休眠后再打开TeleAgent页面白屏或闪退
    a: '您好！电脑休眠后TeleAgent应用状态异常且不会自动恢复。

      处理：重启应用即可。建议长时间不用时先关闭应用，避免休眠导致问题。如有其他问题请联系在线客服！'
    status: 已解决
  - q: TeleAgent白屏问题
    a: 您好！通常由网络异常、前端渲染失败或异常代理环境导致，可尝试切换网络（如手机热点）后重试；单任务交互轮次过多会导致日志过大白屏，建议将不相关工作另建新任务。
    status: 使用引导
  - q: TeleAgent任务日志太大导致内存崩溃
    a: 您好！长期在一个会话中反复跑任务，会导致单个会话内存超过512M。建议您归档或删除大任务，然后新建任务执行。如有其他问题请联系在线客服！
    status: 使用引导
  - q: 拟态防护封禁IP导致无法登录
    a: 云电脑公用IP可能被拟态拦截，需走解封流程
    status: 排查中
  - q: 发指令显示创建新任务但看不到任务，无提示无回答
    a: 全清重装：完全退出→删除用户数据目录→删除配置目录→控制面板卸载→重新下载安装→重新登录
    status: 临时方案
  - q: 白屏后需要重新登录且默认工作空间被改动怎么解决
    a: 需要重新登录，登录后在右下角把工作空间改回即可
    status: 临时方案
