# admindash 静态托管（SPA）
#
# 运营管理台。只发静态资源，不反代 API；浏览器直连 Django(13492)。
# admindash 无 runtime-env.js 注入点，API 地址已在构建期烧进 bundle。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA history fallback —— 必需。
    # /organizations/:id、/billing/wallets/:id、/ai/models、/monitoring/queues
    # 等深链由 react-router BrowserRouter 接管。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
