# tabtin-web 静态托管（SPA）
#
# 本方案是「每服务独立端口」形态：本容器只发静态资源，不反代 API。
# 浏览器直连 Django(13492) / collab-live(13493) / Centrifugo(13494)，
# 跨域由 Django 的 CORS_ALLOWED_ORIGINS 与 Centrifugo 的 allowed_origins 放行。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 反代场景下拿真实客户端 IP 记日志
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    # 运行时配置注入点：index.html 里 <script src="/runtime-env.js">，
    # src/config/api.ts 优先读 window.__TABTIN_RUNTIME_CONFIG__。
    # 必须 no-store，否则挂卷覆写后浏览器仍吃旧配置。
    location = /runtime-env.js {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # 入口文档不缓存，保证发版后能立刻拿到新的 asset 指纹
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # 带内容指纹的构建产物，可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA history fallback —— 必需。
    # /shared/docs/:id、/shared/tables/:id、/forms/:shareId、/invite/:token
    # 等深链由 react-router BrowserRouter 接管，服务端没有对应文件。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
